spring.application.name=facturacion-sunat

# Puerto del servidor
server.port=8080

# ============================================
# BASE DE DATOS - SQL Server
# ============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=facturacion_sunat;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURACION SUNAT - VALORES POR DEFECTO
# (Estos se sobreescriben con datos del emisor de BD)
# ============================================
sunat.endpoint.beta=https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
sunat.endpoint.produccion=https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService

# ============================================
# LOGGING
# ============================================
logging.level.pe.com.movimientos=DEBUG
logging.level.org.apache.cxf=INFO
logging.level.org.hibernate.SQL=DEBUG
