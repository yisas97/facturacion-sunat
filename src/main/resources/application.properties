spring.application.name=facturacion-sunat

# Puerto del servidor
server.port=8080

# ============================================
# CONFIGURACION SUNAT - CONEXION
# ============================================

# RUC de la empresa
sunat.ruc=10724808358

# Usuario SOL (sin RUC, solo el usuario)
sunat.sol.usuario=URIALEGA

# Clave SOL
sunat.sol.clave=thollogra

# Endpoint de SUNAT
# BETA (pruebas): https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
# PRODUCCION:    https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService
sunat.endpoint.url=https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService

# ============================================
# DATOS DEL EMISOR (para generar XML)
# ============================================

sunat.emisor.razonSocial=MI EMPRESA SAC
sunat.emisor.nombreComercial=MI EMPRESA
sunat.emisor.ubigeo=150101
sunat.emisor.direccion=AV. PRINCIPAL 123
sunat.emisor.departamento=LIMA
sunat.emisor.provincia=LIMA
sunat.emisor.distrito=LIMA

# ============================================
# CERTIFICADO DIGITAL
# ============================================

# Ruta al certificado (puede ser classpath: o file:)
sunat.certificado.ruta=classpath:certificado/certificado.pfx
sunat.certificado.clave=123456

# ============================================
# LOGGING
# ============================================
logging.level.pe.com.movimientos=DEBUG
logging.level.org.apache.cxf=INFO
